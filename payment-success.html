<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Trinity Patent Solutions</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f4f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{

            width:90%;
            max-width:650px;
            background:white;
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,.15);
            padding:40px;
            text-align:center;

        }

        .tick{

            font-size:80px;
            color:#28a745;

        }

        h1{

            color:#1565C0;
            margin-top:15px;

        }

        h2{

            color:#28a745;
            margin-top:10px;
            margin-bottom:25px;

        }

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:20px;

        }

        td{

            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:left;

        }

        td:first-child{

            font-weight:bold;
            width:40%;

        }

        .btn{

            display:inline-block;
            margin-top:35px;
            padding:15px 35px;
            background:#1565C0;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;

        }

        .btn:hover{

            background:#0D47A1;

        }

        .footer{

            margin-top:30px;
            color:#777;

        }

    </style>

</head>

<body>

<div class="card">

    <div class="tick">✔</div>

    <h1>Trinity Patent Solutions</h1>

    <h2>Payment Successful</h2>

    <table>

        <tr>
            <td>Payment Status</td>
            <td id="status">SUCCESS</td>
        </tr>

        <tr>
            <td>Order ID</td>
            <td id="orderid">Loading...</td>
        </tr>

        <tr>
            <td>Reference ID</td>
            <td id="reference">Will be available after backend verification</td>
        </tr>

        <tr>
            <td>Amount</td>
            <td id="amount">Will be verified</td>
        </tr>

        <tr>
            <td>Date & Time</td>
            <td id="datetime"></td>
        </tr>

    </table>

    <a href="https://trinitypatsol.com" class="btn">
        Return to Home
    </a>

    <div class="footer">

        Thank you for choosing Trinity Patent Solutions.

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const orderId = params.get("order_id");
const cfOrderId = params.get("cf_order_id");

document.getElementById("orderid").innerHTML =
    orderId ? orderId : "Not Available";

document.getElementById("reference").innerHTML =
    cfOrderId ? cfOrderId : "Not Available";

document.getElementById("datetime").innerHTML =
    new Date().toLocaleString();

</script>

</body>
</html>
