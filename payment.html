<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Patent Solutions | Payment</title>

    <!-- Cashfree SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f4f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:90%;
            max-width:650px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
            text-align:center;
        }

        h1{
            color:#1565C0;
            margin-bottom:10px;
        }

        h3{
            color:#555;
            margin-bottom:30px;
            font-weight:normal;
        }

        input{
            width:250px;
            padding:12px;
            font-size:26px;
            text-align:center;
            border:2px solid #1565C0;
            border-radius:10px;
        }

        button{
            margin-top:25px;
            padding:15px 35px;
            font-size:20px;
            background:#1565C0;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#0D47A1;
        }

        #paymentStatus{
            margin-top:30px;
            font-size:18px;
            color:#1565C0;
            word-break:break-word;
        }

        pre{
            text-align:left;
            background:#f5f5f5;
            padding:15px;
            border-radius:10px;
            overflow:auto;
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Trinity Patent Solutions</h1>

    <h3>Secure Cashfree Payment</h3>

    <input
        type="number"
        id="amount"
        placeholder="Enter Amount"
        min="1">

    <br>

    <button onclick="generateQR()">
        Pay Now
    </button>

    <div id="paymentStatus">
        Waiting...
    </div>

</div>

<script>

async function generateQR() {

    const amount = Number(document.getElementById("amount").value);

    if(amount<=0 || isNaN(amount)){
        alert("Please enter a valid amount.");
        return;
    }

    document.getElementById("paymentStatus").innerHTML =
        "Creating Cashfree Order...";

    try{

        const response = await fetch(
            "https://trinity-payment-backend.onrender.com/create-order",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    amount:amount
                })
            }
        );

        const data = await response.json();

        console.log("Backend Response:",data);

        if(!data.payment_session_id){

            document.getElementById("paymentStatus").innerHTML=
                "<b>Backend Error</b><br><pre>"+JSON.stringify(data,null,2)+"</pre>";

            return;
        }

        document.getElementById("paymentStatus").innerHTML =
            "Opening Cashfree Checkout...";

        const cashfree = Cashfree({
            mode:"production"
        });

        cashfree.checkout({
            paymentSessionId:data.payment_session_id,
            redirectTarget:"_self"
        }).then(function(result){

            console.log("Checkout Result",result);

        }).catch(function(error){

            console.error("Checkout Error",error);

            document.getElementById("paymentStatus").innerHTML =
                "<b>Checkout Error</b><br>"+JSON.stringify(error);

        });

    }

    catch(error){

        console.error(error);

        document.getElementById("paymentStatus").innerHTML =
            "<b>Connection Error</b><br>"+error.message;

    }

}

</script>

</body>
</html>
